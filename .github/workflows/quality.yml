name: quality
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore Timesheet.sln
      - run: dotnet format Timesheet.sln --verify-no-changes --no-restore
      - run: dotnet build Timesheet.sln -c Release --no-restore -warnaserror
      - run: dotnet test Timesheet.sln -c Release --no-build --collect:"XPlat Code Coverage"
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
  semgrep:
    runs-on: ubuntu-latest
    container: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config .semgrep.yml --error backend frontend/src
