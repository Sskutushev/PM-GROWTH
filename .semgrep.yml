rules:
  # `.Result` is matched only as a task property access: the word boundary keeps the rule
  # from firing on `FluentValidation.Results` and similar namespaces.
  - id: csharp-sync-over-async
    languages: [csharp]
    message: Sync-over-async can exhaust the thread pool. Await the task instead.
    severity: ERROR
    pattern-regex: "\\.Result\\b|\\.Wait\\(\\)|\\.GetAwaiter\\(\\)\\.GetResult\\(\\)"

  - id: csharp-load-all-mongo
    languages: [csharp]
    message: Never load an unfiltered Mongo collection of unbounded size into memory.
    severity: ERROR
    pattern-regex: "Entries\\.Find\\(FilterDefinition<.*>\\.Empty\\).*ToListAsync"

  - id: csharp-money-double
    languages: [csharp]
    message: Monetary values must use decimal/Decimal128.
    severity: ERROR
    pattern-regex: "(double|float)\\s+(Amount|Budget|Rate|Price|Cost|Total)"

  # An empty catch hides the failure.
  - id: csharp-silent-catch
    languages: [csharp]
    message: Empty catch block swallows the failure silently.
    severity: ERROR
    pattern-regex: "catch\\s*(\\([^)]*\\))?\\s*\\{\\s*\\}"

  - id: react-any-array
    languages: [typescript]
    message: Model API data explicitly; do not erase its type.
    severity: ERROR
    pattern-regex: "useState<any\\[\\]>"

  - id: react-state-mutation
    languages: [typescript]
    message: React state must be updated immutably.
    severity: ERROR
    pattern-regex: "\\.push\\(.*\\);\\s*set[A-Z]"

  - id: locale-date-api
    languages: [typescript]
    message: API dates must use YYYY-MM-DD, never locale-dependent strings.
    severity: ERROR
    pattern: $DATE.toLocaleDateString(...)

  # The response status has to be checked, otherwise a 400/409 looks like success to the user.
  - id: fetch-without-status-check
    languages: [typescript]
    message: Check response.ok before treating a fetch result as success.
    severity: ERROR
    patterns:
      - pattern: |
          const $R = await fetch(...);
          ...
          await $R.json()
      - pattern-not: |
          const $R = await fetch(...);
          ...
          if (!$R.ok) { ... }
          ...
          await $R.json()
