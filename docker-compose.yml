services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}).ok }' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: { context: ., dockerfile: backend/src/Timesheet.Api/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: mongodb://mongo:27017/?replicaSet=rs0
    ports: ["8080:8080"]
    depends_on: { mongo: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"], interval: 5s, timeout: 3s, retries: 20 }
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["5173:80"]
    depends_on: { api: { condition: service_healthy } }
volumes: { mongo-data: {} }
